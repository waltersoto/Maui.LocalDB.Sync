name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers only when you push version tags like v1.0.0
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore (auto-locate project)
      run: dotnet restore Maui.LocalDB.Sync/Maui.LocalDB.Sync/Maui.LocalDB.Sync.csproj

    - name: Build (auto-locate project)
      run: dotnet build Maui.LocalDB.Sync/Maui.LocalDB.Sync/Maui.LocalDB.Sync.csproj --configuration Release --no-restore

    - name: Pack NuGet package (via nuget CLI)
      run: nuget pack Maui.LocalDB.Sync/Maui.LocalDB.Sync.nuspec -OutputDirectory out

    - name: Publish to NuGet
      run: dotnet nuget push out/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

